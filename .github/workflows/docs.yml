name: docs

# Builds the VitePress site in docs/ and the static hosted web editor (apps/web, served at /app/)
# and deploys both to GitHub Pages on every push to main.
# One-time: repo Settings > Pages > Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["docs/**", "apps/web/**", "packages/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # VitePress lastUpdated needs real history

      # The pnpm version comes from docs/package.json "packageManager".
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: docs

      - run: pnpm build
        working-directory: docs

      # Hosted editor: static export, no server and no API routes (see apps/web/scripts/build-hosted.mjs).
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @daggler/web build:hosted
      - run: |
          mkdir -p docs/.vitepress/dist/app
          cp -r apps/web/out/. docs/.vitepress/dist/app/
          touch docs/.vitepress/dist/.nojekyll

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
