name: Release

# Fires only on a version tag: `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # npm trusted publishing: registered on npmjs.com for this repo, workflow
    # release.yml and environment `npm`. No long-lived registry token is used.
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token for trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install: true
          cache: false # publishing job: no restored caches
      - run: mise run install
      - name: Tag matches apps/cli version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./apps/cli/package.json").version')"
          [ "$tag" = "$pkg" ] || { echo "tag $tag != apps/cli version $pkg" >&2; exit 1; }
      - run: mise run typecheck
      - run: mise run test
      - run: mise run build:cli
      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node's bundled npm is older.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11 && npm --version
      # pnpm packs (resolving workspace: deps), npm >= 11.5.1 publishes via OIDC.
      - name: Publish daggler-cli to npm
        working-directory: apps/cli
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP/pack"
          npm publish "$RUNNER_TEMP"/pack/daggler-cli-*.tgz --provenance --access public

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
