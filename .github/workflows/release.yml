name: Release

# Fires only on a version tag: `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - name: Tag matches apps/cli version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./apps/cli/package.json").version')"
          [ "$tag" = "$pkg" ] || { echo "tag $tag != apps/cli version $pkg" >&2; exit 1; }
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter daggler-cli build
      - name: Publish daggler-cli to npm
        working-directory: apps/cli
        run: pnpm publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
